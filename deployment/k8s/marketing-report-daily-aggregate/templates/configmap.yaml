apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "marketing-report-daily-aggregate.fullname" . }}
data:
  appsetting.json: | 
    {
    }
  monitor.settings.json: |
    {
      "Logging":{
        "Console": {
          "FormatterName": "json",
          "FormatterOptions": {
            "IncludeScopes": "True",
            "TimestampFormat": "HH:mm:ss "
          }
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
