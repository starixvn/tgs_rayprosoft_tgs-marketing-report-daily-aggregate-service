apiVersion: batch/v1
kind: CronJob
metadata:
  name: marketing-background-scheduler
spec:
  schedule: "0 21 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: marketing-background-job
            image: alpine/curl:3.14
            imagePullPolicy: IfNotPresent
            command:
            - curl
            - -X
            - POST
            - http://marketing-report-daily-aggregate/schedule/marketing
          restartPolicy: OnFailure
