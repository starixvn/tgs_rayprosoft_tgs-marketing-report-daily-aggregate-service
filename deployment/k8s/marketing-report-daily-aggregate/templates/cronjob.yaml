apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "marketing-report-daily-aggregate.fullname" . }}-scheduler
spec:
  schedule: {{ .Values.cronjob.schedule }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: marketing-background-job
            image: alpine/curl:8.4.0
            imagePullPolicy: IfNotPresent
            command:
            - curl
            - -X
            - POST
            - http://marketing-report-daily-aggregate/schedule/marketing
          restartPolicy: OnFailure
